title: "Blog"
description: "Thoughts on testing and software engineering"
baseurl: "/articles"
url: "https://rsinghvi.github.io"
# Updated: 2025-11-16

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Comments (giscus) configuration
# To enable comments, fill in the values below using https://giscus.app/
# Ensure GitHub Discussions is enabled on the repository.
giscus:
  repo: rsinghvi/articles
  repo_id: "" # e.g., R_kgDOLxxxx
  category: General
  category_id: "" # e.g., DIC_kwDOxxxx4CAXXXXX
  mapping: pathname
  strict: 0
  reactions_enabled: 1
  emit_metadata: 0
  input_position: bottom
  theme: light
  lang: en

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Collections
collections:
  posts:
    output: true
    permalink: /:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Rahul Singhvi"

# Site settings
author:
  name: "Rahul Singhvi"
  email: "rsinghvi.pune@gmail.com"

# Analytics (optional)
# google_analytics: UA-XXXXXXXX-X

# Social (optional)
github_username: rsinghvi
linkedin_username: rahul-singhvi
# twitter_username: your_twitter

# Pagination
paginate: 10
paginate_path: "/page:num/"

# Reading time calculation
reading_time: true